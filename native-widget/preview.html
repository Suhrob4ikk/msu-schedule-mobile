<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Виджет «Плитки» А — все размеры</title>
<!--
  Вариант А «Предмет крупно», одна карточка на весь виджет (владелец 9 ноя 2026 по скриншотам с Poco). Проверка без
  телефона: раскладка как в gen-layouts.js (поля 16 / 14, статус 14, название на весах с autoSize от 16 до предела раскладки (24…60 dp, по самому длинному слову) и до 3 строк,
  «кто ведёт» 14 — только от 150 dp высоты, низ — время 17 и «ауд.» + номер высотой 16 % виджета (24…40), полоска 5).
  autoSize повторён здесь: самый крупный размер, при котором название целиком (слово не рвётся) влезает в свою коробку.
  Решения «что показать» — копия buildTiles (ScheduleWidget.kt): меняешь там — меняй здесь.
  Красная рамка — что-то вылезло, жёлтая — название с многоточием. Шрифт — Roboto; у телефона может быть свой (MiSans).
-->
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@800&family=Roboto:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --fill:#0E9B72; --on:#0B0D10; --on2:rgba(11,13,16,.66); --track:#5DC09D; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#0A0B0E; color:#E8EAF0; font:14px/1.4 system-ui,"Segoe UI",Roboto,sans-serif; padding:22px 16px 60px; }
  h1 { font-size:22px; margin-bottom:6px; }
  .note { color:#9AA1B2; max-width:1100px; margin-bottom:14px; }
  .ctl { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .ctl button { background:#1E2330; color:#E8EAF0; border:1px solid #2C3240; border-radius:999px; padding:6px 14px; font:inherit; cursor:pointer; }
  .ctl button.on { background:var(--fill); color:#0B0D12; border-color:transparent; font-weight:700; }
  #sum { margin-bottom:14px; font-weight:600; }
  table { border-collapse:separate; border-spacing:14px; }
  th { color:#9AA1B2; font-weight:600; font-size:12px; text-align:left; vertical-align:bottom; }
  td { vertical-align:top; }
  .w { background:var(--fill); color:var(--on); border-radius:22px; padding:14px 16px; display:flex; flex-direction:column; overflow:hidden; font-family:Roboto,sans-serif; line-height:1.172; }
  .w > * { flex-shrink:0; }
  .top { display:flex; align-items:center; font-size:14px; white-space:nowrap; }
  .top .dot { width:8px; height:8px; border-radius:50%; background:var(--on); margin-right:7px; flex:none; }
  .top .st { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; font-weight:700; }
  .top .lbl { font-weight:500; margin-left:8px; }
  .top .cd { font-weight:900; margin-left:4px; }
  .subj { flex:1 1 0 !important; min-height:0; margin-top:6px; font-weight:900; overflow:hidden; overflow-wrap:anywhere; }
  .meta { color:var(--on2); font-size:14px; font-weight:500; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bot { display:flex; align-items:center; margin-top:8px; }
  .bot .time { flex:1; min-width:0; font-size:17px; font-weight:700; white-space:nowrap; overflow:hidden; }
  .bot .al { font-size:14px; font-weight:500; margin:0 5px 0 10px; }
  .bot .room { font-family:Onest,sans-serif; font-weight:800; white-space:nowrap; display:block; }
  .bar { height:5px; border-radius:2.5px; background:var(--track); margin-top:10px; overflow:hidden; }
  .bar span { display:block; height:100%; width:49%; background:var(--on); border-radius:2.5px; }
  .bad { outline:2px solid #E5484D; outline-offset:2px; }
  .warn { outline:2px solid #E5B84D; outline-offset:2px; }
  .lab { color:#6F7686; font-size:11px; margin-top:3px; }
</style>
</head>
<body>
<h1>Виджет «Плитки», вариант А — все размеры</h1>
<p class="note">Строки — высота, столбцы — ширина (dp). Меньше 250 dp в ширину виджет не делается (2×2 не нужен).
Красная рамка — что-то вылезло (так быть не должно), жёлтая — название с многоточием.</p>
<div class="ctl" id="ctl"></div>
<div id="sum"></div>
<div id="out"></div>
<script>
const SCEN = {
  live: { name: "Идёт пара", live: true, status: ["Идёт · III пара", "Идёт · III"], lbl: "осталось", cd: "45:12",
    subj: "Языки и методы программирова", meta: "Лекция · Самохина М.А.", time: ["11:30 – 13:00", "11:30"], room: "208" },
  later: { name: "Завтра (ваш скриншот)", live: false, status: ["Завтра, вторник · II пара", "Завтра · II"], lbl: "через", cd: "10 ч",
    subj: "Численные методы", meta: "Практика · Хайбуллоев Д.А.", time: ["09:45 – 11:15", "09:45"], room: "702" },
  hard: { name: "Длинное и лаборатория", live: true, status: ["Идёт · I пара", "Идёт · I"], lbl: "осталось", cd: "1:25:13",
    subj: "ДВ: Объектно-ориентированное программирование и проектирование", meta: "Практика · Стаценко Ю.Ю., Охонвалиева Ш.С.",
    time: ["08:00 – 09:30", "08:00"], room: "Лаб. физики" },
};
const W8 = { x: 900, b: 700, m: 500 };
const cv = document.createElement("canvas").getContext("2d");
const width = (t, f, s) => { cv.font = `${W8[f]} ${s}px Roboto`; return cv.measureText(t).width; };
const ROOM_ASPECT = r => { const e = document.createElement("span"); e.style.cssText = "position:absolute;visibility:hidden;font:800 100px Onest;white-space:nowrap"; e.textContent = r; document.body.appendChild(e); const x = e.getBoundingClientRect().width; e.remove(); return x / 74; };

// ── Копия buildTiles: что показать и какая раскладка (предел autoSize) ──
const SUBJ_MAX = [24, 30, 36, 44, 52, 60];
const LH = 1.172;
function plan(sc, w, h) {
  const contentW = w - 32;
  const cd = sc.cd;
  let shortStatus = false, showLbl = !!cd;
  const topW = () => width(sc.status[shortStatus ? 1 : 0], "b", 14) + (sc.live ? 15 : 0) + (showLbl ? 8 + width(sc.lbl, "m", 14) : 0) + (cd ? 4 + width(cd, "x", 14) : 0);
  if (topW() > contentW) shortStatus = true;
  if (topW() > contentW) showLbl = false;
  const meta = !!sc.meta && h >= 150;
  const numbered = /^\d/.test(sc.room.trim()); const asp = ROOM_ASPECT(sc.room), lblW = numbered ? width("ауд.", "m", 14) + 15 : 10;
  const roomH = Math.max(16, Math.min(Math.min(asp > 3 ? 26 : 40, Math.max(24, h * 0.16)), (contentW - width(sc.time[1], "b", 17) - lblW - 16) / asp));
  const fullTime = width(sc.time[0], "b", 17) + lblW + roomH * asp <= contentW;
  const longest = Math.max(...sc.subj.split(/\s+|(?<=-)/).map(x => width(x, "x", 100) / 100));
  const maxSize = (contentW - 2) / longest;
  let bi = -1; SUBJ_MAX.forEach((m, i) => { if (m <= maxSize) bi = i; });
  const max = SUBJ_MAX[Math.max(0, bi)];
  // Коробка названия — всё, что осталось по высоте (как вес 1 в LinearLayout)
  const boxH = h - 28 - 14 * LH - 6 - (meta ? 4 + 14 * LH : 0) - 8 - Math.max(17 * LH, roomH) - (sc.live ? 15 : 0);
  return { shortStatus, showLbl, meta, roomH, fullTime, max, boxH, contentW, numbered };
}

// ── autoSize, как у TextView (uniform): самый крупный размер от 16 до предела, при котором текст влезает в коробку
//    (не больше 3 строк). Перенос — как StaticLayout: по словам, длинное слово — по буквам (поэтому и нужен предел). ──
function wrapLines(text, s, w) {
  let n = 1, cur = "";
  for (const wd of text.split(" ")) {
    const t = cur ? cur + " " + wd : wd;
    if (width(t, "x", s) <= w || !cur) cur = t; else { n++; cur = wd; }
    while (width(cur, "x", s) > w && cur.length > 1) {
      let k = cur.length; while (k > 1 && width(cur.slice(0, k), "x", s) > w) k--;
      cur = cur.slice(k); n++;
    }
  }
  return n;
}
function autoSize(text, w, boxH, max) {
  for (let s = max; s >= 16; s--) { const n = wrapLines(text, s, w); if (n <= 3 && n * s * LH <= boxH) return s; }
  return 16;
}

function widget(sc, w, h) {
  const pl = plan(sc, w, h);
  const size = 1, lines = 1;
  const top = `<div class="top">${sc.live ? '<i class="dot"></i>' : ""}<span class="st">${sc.status[pl.shortStatus ? 1 : 0]}</span>
    ${pl.showLbl ? `<span class="lbl">${sc.lbl}</span>` : ""}<span class="cd">${sc.cd}</span></div>`;
  const html = `<div class="w" style="width:${w}px;height:${h}px">${top}<div class="subj" data-max="${pl.max}" data-cw="${pl.contentW}" style="font-size:1px">${sc.subj}</div>
    ${pl.meta ? `<div class="meta">${sc.meta}</div>` : ""}
    <div class="bot"><span class="time">${pl.fullTime ? sc.time[0] : sc.time[1]}</span>${pl.numbered ? '<span class="al">ауд.</span>' : '<span style="width:10px"></span>'}
    <span class="room" style="font-size:${pl.roomH / 0.74}px;line-height:${pl.roomH}px;height:${pl.roomH}px">${sc.room}</span></div>
    ${sc.live ? '<div class="bar"><span></span></div>' : ""}</div>`;
  return { html, pl, size };
}

const WS = [250, 280, 300, 340, 370, 420];
const HS = [120, 150, 170, 200, 225, 260, 300, 360, 420];
let cur = "live";
function draw() {
  const sc = SCEN[cur];
  let html = "<table><tr><th></th>" + WS.map(w => `<th>${w}</th>`).join("") + "</tr>";
  for (const h of HS) html += `<tr><th>${h}</th>` + WS.map(w => `<td>${widget(sc, w, h).html}<div class="lab">${w}×${h}</div></td>`).join("") + "</tr>";
  document.getElementById("out").innerHTML = html + "</table>";
  let bad = 0, warn = 0;
  document.querySelectorAll(".subj").forEach(sj => {
    const box = sj.clientHeight;
    const s = autoSize(sj.textContent, +sj.dataset.cw, box, +sj.dataset.max);
    sj.dataset.box = box; sj.dataset.lines = wrapLines(sj.textContent, s, +sj.dataset.cw);
    sj.style.fontSize = s + "px";
  });
  document.querySelectorAll(".w").forEach(wd => {
    const sj = wd.querySelector(".subj");
    const s = parseFloat(sj.style.fontSize), n = +sj.dataset.lines;
    wd.nextElementSibling.textContent += ` · ${s} dp`;
    const over = wd.scrollHeight > wd.clientHeight + 1 || [...wd.querySelectorAll(".bot,.top")].some(b => b.scrollWidth > b.clientWidth + 1) ||
      +sj.dataset.box < s * LH;
    if (over) { wd.classList.add("bad"); bad++; } else if (n > 3 || n * s * LH > +sj.dataset.box + 0.5) { wd.classList.add("warn"); warn++; }
  });
  document.getElementById("sum").textContent = `${WS.length * HS.length} размеров: не влезло — ${bad}, название с многоточием — ${warn}`;
}
const ctl = document.getElementById("ctl");
for (const [k, v] of Object.entries(SCEN)) {
  const b = document.createElement("button"); b.textContent = v.name; b.dataset.k = k;
  b.onclick = () => { cur = k; [...ctl.children].forEach(x => x.classList.toggle("on", x === b)); draw(); };
  ctl.appendChild(b);
}
cur = SCEN[location.hash.slice(1)] ? location.hash.slice(1) : "live";
[...ctl.children].forEach(x => x.classList.toggle("on", x.dataset.k === cur));
// Считать — только когда стили Google Fonts подключены и шрифты загружены: иначе холст меряет запасным шрифтом
new Promise(r => window.addEventListener("load", r)).then(() => Promise.all(["500 14px Roboto", "700 14px Roboto", "900 14px Roboto", "800 14px Onest"].map(f => document.fonts.load(f, "Яя Лаб. 0123"))))   // с кириллицей: Google отдаёт её отдельным файлом
  .then(() => document.fonts.ready).then(() => setTimeout(draw, 300));
</script>
</body>
</html>
